# Final checkpoints: the only models scripts/run_all.sh evaluates on the test set. Owner: Clemen (C9).
# Frozen with the M3/M4 hashes below. Changing a line after that needs the team's say-so, because
# test is used once.
#
# Rule (fixed before any test run): all three seeds (13, 42, 87) of every system, so test is reported
# as mean ± std like val, and no seed is ever picked by looking at test. The error analysis, ranking
# and adversarial scripts use seed 42 (`analysis_seed`). λ is the G3 value in
# configs/evidence/best.yaml. `k` for the sequential pipelines (R9a, R9b) is set on val only (C3)
# and stays null until then.
#
# R7 (λ = 0) re-decodes R4's checkpoints, and R9a/R9b re-decode R3/R4 outputs, so none of them has a
# checkpoint of its own.
#
# Every checkpoint sits at outputs/<run_id>_s<seed>/best (a directory holding model.pt, encoder/,
# tokenizer files and config.yaml); its committed val run record is results/runs/<run_id>_s<seed>.json.
# run_all.sh reuses that record's identity and training fields (git_sha, config, GPU hours) for the
# test record. sha256 is of model.pt, checked by `run_all.sh verify`; null blocks the test stage.
# Large files stay out of git (shared on Drive; see README §6). To place one:
#   mkdir -p outputs/<run_id>_s<seed>/best && unzip -j <run_id>_s<seed>.zip -d outputs/<run_id>_s<seed>/best
# (the r3_share zips hold those files directly; the R5 handoff tar already unpacks to .../best/).

seeds: [13, 42, 87]
analysis_seed: 42
decode:
  lam: 0.25      # configs/evidence/best.yaml (G3)
  k: null        # C3: set on val, then frozen here

