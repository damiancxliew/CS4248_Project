# R3: DeBERTa-v3-base span-only (= the full model without the ranking objective). Owner: Damian.
#
# learning_rate / epochs / warmup_ratio below are base.yaml placeholders until the D3 search.
# D3 grid, seed 42, val only: learning_rate {1e-5, 2e-5, 3e-5} x epochs {2, 3} x warmup_ratio {0.06, 0.10}
# (12 runs). Run them with configs/deberta_span/d3_grid.sh (list / run <i|all> / summary).
# Damian picks the setting; it goes in configs/deberta_span/best.yaml and is frozen for every
# DeBERTa variant (R3-R7, R6b). R3 then runs seeds 13, 42, 87 with --record.

run_id: r3_deberta_span
system: deberta_span_only
variant: span_only

model:
  encoder: microsoft/deberta-v3-base
