# G3: DeBERTa-v3-base evidence model (span head + sentence ranker), model-mined negatives. Owner: Gokul.
#
# The grid's experiment config (configs/evidence/g3_grid.sh), seed 42, val only:
# alpha {0.1, 0.3, 1.0} x beta {0.5, 1.0} x margin {0.5, 1.0} = 12 runs, each decoded at
# lambda {0, 0.25, 0.5, 1, 2}. The values below are only the starting point; the grid overrides
# them, and the pick goes to configs/evidence/best.yaml.
# D3's frozen hyper-parameters equal base.yaml's train defaults, so no train overrides here.

run_id: g3_evidence
system: deberta_evidence
variant: model_mined

model:
  class: qa.models.evidence_model:EvidenceModel
  encoder: microsoft/deberta-v3-base
  neg_mode: model
  alpha: 0.3
  beta: 1.0
  margin: 0.5
  evidence_dir: data/processed   # C3 evidence_{train,val}.jsonl (Jun Yip, J1)
