# R6: random negatives. R4 with a fixed random candidate sentence (C3 rand_neg) as the negative
# instead of the one the ranker scores highest. Runner: Jun Yip (J4). Seeds 13, 42, 87 on h100-47:
#
#   sbatch configs/ablations/ablation_slurm.sbatch configs/ablations/r6_random_negatives.yaml
#
# Identical to r4_full.yaml except run_id, variant and model.neg_mode.

run_id: r6_deberta_evidence
system: deberta_evidence
variant: random_negatives

model:
  class: qa.models.evidence_model:EvidenceModel
  encoder: microsoft/deberta-v3-base
  neg_mode: random
  alpha: 0.3
  beta: 0.5
  margin: 1.0
  evidence_dir: data/processed   # C3 evidence_{train,val}.jsonl (Jun Yip, J1)

decode:
  lam: 0.25                      # joint decoding weight; the record scores val at this lambda
